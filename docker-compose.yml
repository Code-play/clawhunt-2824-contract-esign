services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clawhunt-contract-db
    environment:
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: contract_local_dev
      POSTGRES_DB: contract
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract -d contract"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - crm_contract_pgdata:/var/lib/postgresql/data

volumes:
  crm_contract_pgdata:
