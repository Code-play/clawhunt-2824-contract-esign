[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-contract-esign"
version = "1.0.0"
description = "Contract field validation, post-signature locking and e-signature status callback flow (member space platform)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["crm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "acceptance: maps to one acceptance criterion of ticket S2-CRM-023",
  "integration: requires a live PostgreSQL 16 instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI's dependency markers (Depends/Header/Query) are function calls in
# argument defaults by design, so B008 is not useful here.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The test database URL must be exported before the application is imported.
"tests/conftest.py" = ["E402"]
